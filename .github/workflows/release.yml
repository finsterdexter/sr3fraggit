name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,    rid: win-x64,    kind: windows }
          - { os: windows-11-arm,    rid: win-arm64,  kind: windows }
          - { os: ubuntu-latest,     rid: linux-x64,  kind: appimage, arch: x86_64 }
          - { os: ubuntu-24.04-arm,  rid: linux-arm64, kind: appimage, arch: aarch64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Tag v1.2.3 -> VERSION 1.2.3 (assembly version must be numeric). bash is available
      # on the GitHub-hosted Windows runners too, so this works across the whole matrix.
      - name: Compute version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish (Windows)
        if: matrix.kind == 'windows'
        shell: bash
        run: |
          dotnet publish SR3Generator.Avalonia -c Release -r ${{ matrix.rid }} \
            -p:PublishSingleFile=true --self-contained true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishReadyToRun=true \
            -p:DebugType=none \
            -p:Version=$VERSION \
            -o publish/${{ matrix.rid }}
          mkdir -p dist
          cp "publish/${{ matrix.rid }}/sr3fraggit.exe" \
             "dist/sr3fraggit-${GITHUB_REF_NAME}-${{ matrix.rid }}.exe"

      - name: Publish (Linux AppImage)
        if: matrix.kind == 'appimage'
        shell: bash
        env:
          # appimagetool is itself an AppImage; this lets it run on runners without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          curl -sSL -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool

          # Publish dir contains 'appimage', which triggers the CreateAppImage target in
          # the .csproj. That target emits the .AppImage one level up from the publish dir.
          dotnet publish SR3Generator.Avalonia -c Release -r ${{ matrix.rid }} \
            -p:PublishSingleFile=true --self-contained true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishReadyToRun=true \
            -p:DebugType=none \
            -p:Version=$VERSION \
            -p:AppImageArch=${{ matrix.arch }} \
            -o publish/appimage-${{ matrix.rid }}
          mkdir -p dist
          cp "publish/sr3fraggit-${{ matrix.arch }}.AppImage" \
             "dist/sr3fraggit-${GITHUB_REF_NAME}-${{ matrix.rid }}.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and attach assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true
