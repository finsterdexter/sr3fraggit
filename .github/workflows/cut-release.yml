name: Cut Release

# Manually-triggered: drafts a GitHub release whose notes are autogenerated from the
# commit subjects since the last published release (grouped by prefix: Add/Implement →
# Features, Fix → Fixes, everything else → Changes).
#
# Nothing permanent happens at this stage: a draft release has no tag and is not
# public. Review and EDIT the draft notes on the Releases page — the edited body is
# what ships — then click "Publish release". Publishing creates the v-tag and fires:
#   * release.yml          — builds and attaches the platform assets
#   * update-changelog.yml — prepends the published body to CHANGELOG.md
# Publishing must stay a manual click anyway: events created with the workflow's own
# GITHUB_TOKEN don't trigger other workflows, so a self-publishing workflow would
# silently skip the asset build and the changelog update.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.10.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, needed for the commit range

      - name: Resolve version and last release
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -qP '^\d+\.\d+\.\d+'; then
            echo "::error::'$VERSION' is not a semver version"; exit 1
          fi
          TAG="v$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"; exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::A release (or draft) for $TAG already exists"; exit 1
          fi

          LAST_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" \
            --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "LAST_TAG=$LAST_TAG" >> "$GITHUB_ENV"

      - name: Generate notes from commits
        run: |
          RANGE=""
          if [ -n "$LAST_TAG" ]; then RANGE="$LAST_TAG..HEAD"; fi

          # Commit subjects since the last release, oldest first. Drop merge commits and
          # the bot's own changelog commits.
          git log $RANGE --no-merges --reverse --pretty='%s' \
            | grep -v '^Update CHANGELOG for ' > /tmp/subjects.txt || true

          if ! [ -s /tmp/subjects.txt ]; then
            echo "::error::No commits since $LAST_TAG — nothing to release"; exit 1
          fi

          {
            FEATS=$(grep -P '^(Add|Implement|Introduce|Support|Create) ' /tmp/subjects.txt || true)
            FIXES=$(grep -P '^(Fix|Correct|Repair) ' /tmp/subjects.txt || true)
            REST=$(grep -vP '^(Add|Implement|Introduce|Support|Create|Fix|Correct|Repair) ' /tmp/subjects.txt || true)

            if [ -n "$FEATS" ]; then
              echo "### ✨ New Features"
              echo "$FEATS" | sed 's/^/- /'
              echo
            fi
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Fixes"
              echo "$FIXES" | sed 's/^/- /'
              echo
            fi
            if [ -n "$REST" ]; then
              echo "### 🔧 Changes"
              echo "$REST" | sed 's/^/- /'
              echo
            fi
            if [ -n "$LAST_TAG" ]; then
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$LAST_TAG...$TAG"
            fi
          } > /tmp/notes.md

      - name: Create draft release
        run: |
          URL=$(gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --notes-file /tmp/notes.md)

          {
            echo "## Draft release created: [$TAG]($URL)"
            echo
            echo "Edit the notes there (the edited body is what lands in CHANGELOG.md),"
            echo "then **Publish release** to create the tag, build the assets, and update"
            echo "the changelog."
            echo
            echo "---"
            echo
            cat /tmp/notes.md
          } >> "$GITHUB_STEP_SUMMARY"
